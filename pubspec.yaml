name: marketplace_gig
description: Local marketplace and gig economy app with Material Design 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  cached_network_image: ^4.0.0
  dynamic_color: ^1.9.0
  device_info_plus: ^13.3.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.3.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  uuid: ^4.5.1
  device_preview: ^1.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
